<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/icon-64.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon-180.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/icon-64.png' | relative_url }}" alt="" width="28" height="28">
      <span>Metaphrasis</span>
    </a>
    <nav aria-label="Site">
      <a href="{{ '/releases/' | relative_url }}">Releases</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
    </nav>
  </header>

  <main class="{{ page.main_class | default: 'page' }}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <nav aria-label="Legal">
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms of Use</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="{{ '/releases/' | relative_url }}">Release Notes</a>
    </nav>
    <p>© {{ site.time | date: '%Y' }} {{ site.metaphrasis.publisher }}</p>
  </footer>
</body>
</html>
